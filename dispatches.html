<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1118">
<title>Dispatches · The Wade of Kings</title>
<link rel="stylesheet" href="assets/palanaeum.css">
</head>
<body data-page="dispatches">
<main class="wrap">
  <header class="page-head">
    <h1>Dispatches</h1>
    <p class="lede">Maps, posters and illustrated guides, each stamped with how far into the read it's safe. Most are frozen exactly as they were made. Living dispatches keep growing as Wade reads.</p>
  </header>
  <div class="dp-wall" id="wall"></div>
</main>
<script src="data/palanaeum.js"></script>
<script src="assets/palanaeum.js"></script>
<script>
(function () {
  "use strict";
  const items = P.data.dispatches.filter((d) => P.visible(d.h));
  const wall = document.getElementById("wall");
  wall.innerHTML = items.length ? items.map((d, i) => {
    const u = P.unitById[d.horizon.split("@")[0]];
    const thumb = d.preview || (d.kind === "image" ? d.url : "");
    return `<a class="dp-card${i === 0 ? " dp-feature" : ""}" href="${P.esc(d.url)}" data-img="${d.kind === "image" ? 1 : ""}"${P.isNew(d.h) ? ' data-new="1"' : ""}>
      <div class="dp-thumb">${thumb ? `<img src="${P.esc(thumb)}" alt="" loading="${i < 2 ? "eager" : "lazy"}">` : ""}
        <div class="dp-badges"><span>#${P.esc(d.id)}</span>${d.living ? '<span class="living"><i></i>Living</span>' : "<span>Frozen</span>"}${i === 0 ? "<span>Latest</span>" : ""}</div></div>
      <div class="dp-text"><p class="dp-safe">${d.living ? "Safe through" : "Made at"} ${P.esc(P.unitLabel(u))} · ${P.esc(d.date)}</p>
        <h2>${P.esc(d.title)}</h2><p>${d.caption}</p><p class="note">${d.note}</p></div></a>`;
  }).join("") : `<div class="empty"><strong>No dispatches yet.</strong>They appear at milestones, or whenever a tangle of names needs a map.</div>`;
  wall.querySelectorAll("a[data-img='1']").forEach((a) => a.addEventListener("click", (ev) => {
    ev.preventDefault();
    P.lightbox(a.getAttribute("href"), a.querySelector("h2").textContent);
  }));
})();
</script>
</body>
</html>
